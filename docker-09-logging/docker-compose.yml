services:
  app:
    build: ../docker-07-tested-image
    ports: ["127.0.0.1:3001:3000"]
    environment: {MESSAGE: Logging exercise}
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  collector:
    build: ./fluentd
    profiles: [collector]
    volumes: ["collector-data:/fluentd/log"]
volumes:
  collector-data: {}
