<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>
<match classroom.**>
  @type copy
  <store>
    @type stdout
  </store>
  <store>
    @type file
    path /fluentd/log/classroom
    <buffer time>
      timekey 60
      timekey_wait 1
      flush_mode interval
      flush_interval 5s
    </buffer>
  </store>
</match>
