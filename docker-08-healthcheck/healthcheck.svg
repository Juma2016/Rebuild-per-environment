<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" role="img" aria-labelledby="t d">
<title id="t">Process state and probe result</title><desc id="d">Docker executes a probe inside the container. Consecutive failures affect health status, not the process state or restart counter.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#246b68"/></marker></defs>
<rect width="1100" height="370" fill="white"/><g font-family="Arial,sans-serif" fill="#27312d">
<rect x="300" y="45" width="490" height="210" rx="8" fill="#f5f8f2" stroke="#8eab99"/>
<text x="320" y="30" font-size="19">Inside the container</text>
<rect x="25" y="95" width="210" height="100" rx="6" fill="#edf1f0" stroke="#8eab99"/>
<text x="42" y="127" font-size="21">Docker Engine</text><text x="42" y="156" font-size="17">Schedules and records</text><text x="42" y="179" font-size="17">the probe result</text>
<path d="M235 140H330" stroke="#246b68" stroke-width="2" marker-end="url(#a)"/>
<rect x="335" y="95" width="180" height="100" rx="6" fill="#ebf3df" stroke="#8eab99"/>
<text x="350" y="130" font-size="21">Probe process</text><text x="350" y="162" font-size="17">HTTP request</text>
<path d="M515 140H560" stroke="#246b68" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="95" width="195" height="100" rx="6" fill="#ebf3df" stroke="#8eab99"/>
<text x="584" y="127" font-size="21">Application</text><text x="584" y="156" font-size="17">/health/live</text><text x="584" y="179" font-size="17">/health/ready</text>
<path d="M425 195V230H845V165" fill="none" stroke="#246b68" stroke-width="2" marker-end="url(#a)"/>
<rect x="820" y="65" width="255" height="130" rx="6" fill="#fff0d9" stroke="#b8a07a"/>
<text x="835" y="95" font-size="20">Health status</text><text x="835" y="122" font-size="17">exit 0: healthy</text><text x="835" y="149" font-size="17">repeated exit 1: unhealthy</text><text x="835" y="176" font-size="17">Docker has one health status</text>
<text x="25" y="300" font-size="21">Process: running + Health: unhealthy can occur together.</text>
<text x="25" y="338" font-size="19">Detection does not by itself restart the container or prove a correct business result.</text></g></svg>
