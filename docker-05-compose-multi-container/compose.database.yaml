services:
  db:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a local exercise password}
      MYSQL_DATABASE: exampledb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping",
             "--protocol=tcp", "-h",
             "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [backend]
volumes:
  mysql-data: {}
networks:
  backend: {internal: true}
