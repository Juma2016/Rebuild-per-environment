services:
  app:
    build: .
    image: contdel-proxy-node:lesson06
    ports: ["127.0.0.1:8305:3000"]
    environment:
      MESSAGE: ${MESSAGE:-Hello World}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
