services:
  proxy:
    image: nginx:1.30.6-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      nodeapp: {condition: service_healthy}
      apache: {condition: service_healthy}
    networks: [frontend]
  nodeapp:
    build: ./nodeapp
    networks: [frontend]
  apache:
    image: httpd:2.4.69-alpine
    volumes: ["./public-html:/usr/local/apache2/htdocs:ro"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [frontend]
networks:
  frontend: {}
