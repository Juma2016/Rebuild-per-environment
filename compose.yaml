services:
  app:
    build: ./docker-07-tested-image
    image: contdel-container-app:ws26
    ports: ["127.0.0.1:3000:3000"]
    environment:
      MESSAGE: ${MESSAGE:-Hello World}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
