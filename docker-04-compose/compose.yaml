services:
  db:
    image: mysql:8.4.13
    volumes: ["mysql-volume:/var/lib/mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in local .env}
      MYSQL_DATABASE: wordpressdb
      MYSQL_USER: wordpressuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in local .env}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping",
             "--protocol=tcp", "-h",
             "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [wordpress]
  wordpress:
    depends_on:
      db: {condition: service_healthy}
    build: ./wordpress
    image: contdel-wordpress:lesson06
    ports: ["127.0.0.1:8000:80"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpressuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in local .env}
      WORDPRESS_DB_NAME: wordpressdb
    volumes: ["wordpress-volume:/var/www/html"]
    networks: [wordpress]
volumes:
  mysql-volume: {}
  wordpress-volume: {}
networks:
  wordpress: {}
